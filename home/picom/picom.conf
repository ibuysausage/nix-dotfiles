# General
backend = "glx";
vsync = true;

# Fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.02;
fade-delta = 5;

# Window rules
rules = (
	# Not focused st is dimmed
	{ match = "!focused && class_g = 'st-256color'"; dim = 0.3;},
	{
		match = "class_g = 'dmenu'";
		animations = true;
		animations = ({
		    triggers = [ "open" ];
	        preset = "fly-in";
	        direction = "down";
        },
		{
		    triggers = [ "close" ];
	        preset = "fly-out";
	        direction = "down";
		});
	},
)